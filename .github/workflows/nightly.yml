name: nightly-calibration
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  calibration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest -m slow
      - run: uv run python validation/failure_gallery/01_naive_cv_ttest.py
      - run: uv run python validation/failure_gallery/02_iid_bootstrap_sharpe.py
      - run: uv run python validation/failure_gallery/02b_dm_horizon.py
      - run: uv run python validation/failure_gallery/03_clt_small_n.py
      - run: uv run python validation/failure_gallery/04_peeking.py
      - run: uv run python validation/failure_gallery/05_ignored_clustering.py
      - uses: actions/upload-artifact@v4
        with:
          name: failure-gallery-figures
          path: validation/failure_gallery/figures/
