name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy src/isbetter/core src/isbetter/methods src/isbetter/decision
      - run: uv run pytest -m "not slow"
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(uv run python -c 'import isbetter; print(isbetter.__version__)')" = "$GITHUB_REF_NAME"
      - run: uv build
      - run: uvx twine check dist/*
      - name: Smoke test the wheel in a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd examples
          /tmp/smoke/bin/isbetter run toy_paired.yaml --out /tmp/REPORT.md
          grep -q "A_better_practical" /tmp/REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
