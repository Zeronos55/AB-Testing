[project]
name = "ab-testing"
version = "0.0.0"
description = "Hands-on A/B testing analysis with a Power BI dashboard."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.ruff]
line-length = 100
exclude = ["archive"]
